<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>导航管理</title>
<style>
:root{color-scheme:light;--blue:#2878ff;--line:#e5e7eb;--muted:#667085}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1f2937;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 13px}button.primary{background:var(--blue);border-color:var(--blue);color:white}button.danger{color:#b42318}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.top h1{font-size:24px;margin:0}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:18px}.hidden{display:none!important}.muted{color:var(--muted)}.login{max-width:420px;margin:10vh auto}.login input{width:100%;margin:12px 0}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.field input,.field textarea,.field select,.login input{border:1px solid #d0d5dd;border-radius:8px;padding:10px;background:#fff}.field textarea{min-height:80px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px}.catlist{display:flex;flex-direction:column;gap:6px}.catbtn{text-align:left;display:flex;justify-content:space-between;gap:8px}.catbtn.active{background:#edf4ff;border-color:#9bbfff}.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eef0f3}.item:last-child{border-bottom:0}.favicon{width:32px;height:32px;object-fit:contain;border-radius:7px;background:#f4f5f7}.itemmain{min-width:0;flex:1}.itemmain strong,.itemmain small{display:block;overflow-wrap:anywhere}.itemmain small{color:var(--muted)}.itemactions{display:flex;gap:6px;flex-wrap:wrap}.pill{font-size:12px;border-radius:20px;padding:2px 8px;background:#f2f4f7;color:#475467}.notice{padding:10px 12px;border-radius:8px;background:#fef3c7;color:#92400e;margin-top:12px}.status{margin:10px 0;color:var(--muted);white-space:pre-wrap}.checkbox{display:flex;gap:8px;align-items:center;margin:10px 0}@media(max-width:760px){.wrap{padding:12px}.layout{grid-template-columns:1fr}.catlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.item{align-items:flex-start}.itemactions button{padding:7px}}
</style></head>
<body><div class="wrap">
<section id="login" class="panel login"><h1>导航管理登录</h1><p class="muted">仅管理员可编辑书签和私人收藏。</p><form id="loginForm"><div class="field"><label for="password">管理密码</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" type="submit" style="width:100%">登录</button></form><div id="loginStatus" class="status"></div><p><a href="/" style="color:#2878ff">返回导航首页</a></p></section>
<section id="app" class="hidden">
<header class="top"><div><h1>书签管理</h1><div class="muted">更改需点击“保存到云端”才会生效。</div></div><div class="toolbar"><button id="importBtn">导入 JSON</button><button id="importHtmlBtn">导入浏览器书签 HTML</button><button id="exportBtn">导出备份</button><button id="saveBtn" class="primary">保存到云端</button><button id="logoutBtn">退出登录</button><input id="importFile" type="file" accept=".json,application/json" class="hidden"><input id="importHtmlFile" type="file" accept=".html,.htm,text/html" class="hidden"></div></header>
<div id="status" class="status"></div><div id="emptyHint" class="notice hidden"></div>
<div class="layout"><aside class="panel"><div class="top"><strong>分类</strong><button id="addCatBtn">＋ 新分类</button></div><div id="catList" class="catlist" style="margin-top:12px"></div></aside>
<main class="panel"><div class="top"><div><h2 id="currentTitle" style="margin:0;font-size:20px">选择分类</h2><span id="currentMeta" class="muted"></span></div><div class="toolbar"><button id="editCatBtn">编辑分类</button><button id="deleteCatBtn" class="danger">删除分类</button><button id="addLinkBtn" class="primary">＋ 添加书签</button></div></div><div class="field"><label for="filter">搜索当前分类书签</label><input id="filter" placeholder="输入名称、网址或标签"></div><div id="links"></div></main></div>
</section>
</div>
<dialog id="editor" style="width:min(560px,calc(100% - 24px));border:0;border-radius:12px;padding:22px;box-shadow:0 20px 70px #0003"><form id="editForm"><h2 id="editorTitle" style="margin-top:0">编辑</h2><div id="editorFields"></div><div class="toolbar" style="justify-content:flex-end"><button type="button" id="cancelEdit">取消</button><button class="primary" type="submit">确定</button></div></form></dialog>
<script>
const $=s=>document.querySelector(s);const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
let data={categories:[]},selected=null,editing=null,editType="";const status=t=>$('#status').textContent=t;
async function api(method,path,body){const r=await fetch(path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||('请求失败：'+r.status));return d}
function current(){return data.categories.find(c=>c.id===selected)}
function safeText(s){return String(s??'')}
function renderCats(){const list=$('#catList');list.replaceChildren();data.categories.forEach(c=>{const b=document.createElement('button');b.className='catbtn'+(c.id===selected?' active':'');b.innerHTML='<span></span><span class="pill"></span>';b.children[0].textContent=c.title;b.children[1].textContent=(c.private?'私人 · ':'')+(c.links||[]).length;b.onclick=()=>{selected=c.id;render()};list.append(b)});const c=current();$('#currentTitle').textContent=c?c.title:'选择分类';$('#currentMeta').textContent=c?((c.private?'仅管理员可见':'公开')+' · '+(c.links||[]).length+' 个书签'):'';['#editCatBtn','#deleteCatBtn','#addLinkBtn','#filter'].forEach(s=>$(s).disabled=!c)}
function renderLinks(){const box=$('#links');box.replaceChildren();const c=current();if(!c)return;const q=$('#filter').value.trim().toLowerCase();(c.links||[]).forEach((l,i)=>{if(q&&!([l.title,l.url,l.description,(l.tags||[]).join(' ')].join(' ').toLowerCase().includes(q)))return;const row=document.createElement('div');row.className='item';const img=document.createElement('img');img.className='favicon';img.alt='';img.src=logoSrc(l.logo,l.url);img.onerror=()=>{img.onerror=null;img.src=favicon(l.url)};const main=document.createElement('div');main.className='itemmain';const title=document.createElement('strong');title.textContent=l.title;const sub=document.createElement('small');sub.textContent=l.url+(l.tags?.length?' · '+l.tags.join(', '):'');main.append(title,sub);if(l.private){const p=document.createElement('span');p.className='pill';p.textContent='私人';main.append(p)}if(l.favorite){const p=document.createElement('span');p.className='pill';p.textContent='★ 收藏';main.append(p)}const actions=document.createElement('div');actions.className='itemactions';[['↑',()=>move(i,-1)],['↓',()=>move(i,1)],['编辑',()=>openLink(l.id)],['删除',()=>removeLink(l.id)]].forEach(([t,fn])=>{const b=document.createElement('button');b.textContent=t;b.onclick=fn;actions.append(b)});row.append(img,main,actions);box.append(row)});if(!box.children.length){const p=document.createElement('p');p.className='muted';p.textContent='当前没有书签。点击“添加书签”创建，或导入 JSON 备份。';box.append(p)}}
function favicon(url){try{return 'https://www.google.com/s2/favicons?domain='+encodeURIComponent(new URL(url).hostname)+'&sz=64'}catch{return ''}}function logoSrc(logo,url){if(typeof logo==='string'&&(/^https?:\\/\\//i.test(logo)||logo.startsWith('/assets/')))return logo;return favicon(url)}
function render(){renderCats();renderLinks()}
function move(i,step){const c=current(),j=i+step;if(!c||j<0||j>=c.links.length)return;[c.links[i],c.links[j]]=[c.links[j],c.links[i]];renderLinks()}
function openEditor(title,fields,submit){$('#editorTitle').textContent=title;const root=$('#editorFields');root.replaceChildren();fields.forEach(f=>{const wrap=document.createElement('div');wrap.className='field';const label=document.createElement('label');label.textContent=f.label;label.htmlFor='f_'+f.name;wrap.append(label);let el;if(f.type==='textarea'){el=document.createElement('textarea')}else if(f.type==='checkbox'){el=document.createElement('input');el.type='checkbox';el.className='checkbox'}else{el=document.createElement('input');el.type=f.type||'text'}el.id='f_'+f.name;el.name=f.name;if(f.type!=='checkbox')el.value=f.value??'';else el.checked=!!f.value;if(f.required)el.required=true;wrap.append(el);root.append(wrap)});editing=submit;$('#editor').showModal()}
$('#cancelEdit').onclick=()=>$('#editor').close();$('#editForm').onsubmit=e=>{e.preventDefault();const obj={};new FormData(e.target).forEach((v,k)=>obj[k]=v);e.target.querySelectorAll('input[type=checkbox]').forEach(el=>obj[el.name]=el.checked);editing?.(obj);$('#editor').close();render()}
function openCat(){const c=current();const fields=[{name:'title',label:'分类名称',value:c?.title||'',required:true},{name:'private',label:'私人分类（仅管理员可见）',type:'checkbox',value:c?.private||false}];openEditor(c?'编辑分类':'新建分类',fields,v=>{if(c){c.title=v.title.trim();c.private=!!v.private}else{const n={id:uid(),title:v.title.trim(),private:!!v.private,links:[]};data.categories.push(n);selected=n.id}render()})}
function openLink(id){const c=current();const l=(c?.links||[]).find(x=>x.id===id);const fields=[{name:'title',label:'名称',value:l?.title||'',required:true},{name:'url',label:'网址（需以 http:// 或 https:// 开头）',value:l?.url||'https://',required:true},{name:'description',label:'描述',type:'textarea',value:l?.description||''},{name:'logo',label:'图标网址（可留空自动获取 favicon）',value:l?.logo||''},{name:'tags',label:'标签（用英文逗号分隔）',value:(l?.tags||[]).join(', ')},{name:'private',label:'私人书签（仅管理员可见）',type:'checkbox',value:l?.private||false},{name:'favorite',label:'收藏标记',type:'checkbox',value:l?.favorite||false}];openEditor(l?'编辑书签':'添加书签',fields,v=>{let url;try{url=new URL(v.url)}catch{alert('网址格式不正确');return}if(!['http:','https:'].includes(url.protocol)){alert('只支持 HTTP/HTTPS 网址');return}const item={id:l?.id||uid(),title:v.title.trim(),url:url.href,description:v.description||'',logo:v.logo.trim()||favicon(url.href),tags:(v.tags||'').split(',').map(x=>x.trim()).filter(Boolean),private:!!v.private,favorite:!!v.favorite};if(l)Object.assign(l,item);else c.links.push(item);render()})}
function removeLink(id){if(!confirm('确定删除这个书签？'))return;const c=current();c.links=c.links.filter(l=>l.id!==id);render()}
$('#addCatBtn').onclick=()=>openCat();$('#editCatBtn').onclick=()=>openCat();$('#deleteCatBtn').onclick=()=>{const c=current();if(c&&confirm('删除分类“'+c.title+'”及其中所有书签？')){data.categories=data.categories.filter(x=>x.id!==c.id);selected=data.categories[0]?.id||null;render()}};$('#addLinkBtn').onclick=()=>openLink(null);$('#filter').oninput=renderLinks;
$('#saveBtn').onclick=async()=>{try{status('正在保存…');const d=await api('PUT','/api/bookmarks',data);status('保存成功：'+d.categories+' 个分类。');}catch(e){status('保存失败：'+e.message)}};
$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='webstack-bookmarks-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url)};
$('#importBtn').onclick=()=>$('#importFile').click();$('#importHtmlBtn').onclick=()=>$('#importHtmlFile').click();$('#importHtmlFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10*1024*1024)throw Error('文件超过 10 MB，请先拆分书签文件');const html=await f.text();const parsed=parseBrowserBookmarks(html);if(!parsed.categories.length)throw Error('没有识别到书签或文件夹，请确认这是浏览器导出的书签 HTML');if(!confirm('识别到 '+parsed.categories.length+' 个分类、'+parsed.categories.reduce((n,c)=>n+c.links.length,0)+' 个书签。导入会替换当前编辑中的全部分类，建议先导出备份。是否继续？'))return;data=parsed;selected=data.categories[0]?.id||null;render();status('已载入浏览器书签 HTML，检查无误后点击“保存到云端”。')}catch(err){alert('导入失败：'+err.message)}finally{e.target.value=''}};function parseBrowserBookmarks(html){const doc=new DOMParser().parseFromString(html,'text/html');const root=doc.querySelector('dl');if(!root)throw Error('文件格式不正确：未找到书签列表');const categories=[];const makeCat=(title)=>({id:uid(),title:title.slice(0,200)||'未命名文件夹',private:false,links:[]});function walk(dl,path){for(const node of Array.from(dl.children)){if(node.tagName==='DT'){const heading=node.querySelector(':scope > h3');const anchor=node.querySelector(':scope > a');const childDl=node.querySelector(':scope > dl')||(node.nextElementSibling&&node.nextElementSibling.tagName==='DL'?node.nextElementSibling:null)||(heading&&heading.parentElement&&heading.parentElement.nextElementSibling&&heading.parentElement.nextElementSibling.tagName==='DL'?heading.parentElement.nextElementSibling:null);if(heading){const title=heading.textContent.trim()||'未命名文件夹';const next=path.concat(title);const cat=makeCat(next.join(' / '));if(childDl)walk(childDl,next);if(cat.links.length)categories.push(cat)}else if(anchor){const raw=anchor.getAttribute('href')||'';try{const u=new URL(raw);if(!['http:','https:'].includes(u.protocol))continue;const folder=path.length?path.join(' / '):'导入的书签';let cat=categories.find(c=>c.title===folder);if(!cat){cat=makeCat(folder);categories.push(cat)}cat.links.push({id:uid(),title:(anchor.textContent.trim()||u.hostname).slice(0,300),url:u.href,description:'',logo:favicon(u.href),tags:[],private:false,favorite:false})}catch{}}}}}walk(root,[]);return {categories:categories.filter(c=>c.links.length)}};$('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.categories)||d.categories.length>500)throw Error('文件必须包含有效的 categories 数组（最多 500 个分类）');let total=0;for(const cat of d.categories){if(!cat||typeof cat.title!=='string'||!cat.title.trim()||!Array.isArray(cat.links))throw Error('分类数据格式不正确');total+=cat.links.length;if(total>10000)throw Error('书签总数不能超过 10000 个');for(const link of cat.links){if(!link||typeof link.title!=='string'||!link.title.trim()||typeof link.url!=='string')throw Error('书签数据格式不正确');const u=new URL(link.url);if(!['http:','https:'].includes(u.protocol))throw Error('仅支持 HTTP/HTTPS 网址')}}if(!confirm('导入会替换当前编辑中的全部分类。建议先导出备份，是否继续？'))return;data=d;selected=data.categories[0]?.id||null;render();status('已载入文件，记得点击“保存到云端”。')}catch(err){alert('导入失败：'+err.message)}finally{e.target.value=''}};
$('#logoutBtn').onclick=async()=>{try{await api('DELETE','/api/auth')}catch{}$('#app').classList.add('hidden');$('#login').classList.remove('hidden')};
async function start(){try{const auth=await api('GET','/api/auth');if(!auth.authenticated)return;await showApp()}catch(e){$('#loginStatus').textContent=e.message}}
function convertLegacy(items){const categories=[];for(const group of (Array.isArray(items)?items:[])){const parent=String(group.taxonomy||'未分类');if(Array.isArray(group.links)&&group.links.length)categories.push({id:uid(),title:parent,private:false,links:group.links.map(convertLink).filter(Boolean)});for(const child of (group.list||[])){categories.push({id:uid(),title:parent+' / '+String(child.term||'未命名'),private:false,links:(child.links||[]).map(convertLink).filter(Boolean)})}}return {categories}}
function convertLink(l){let raw=String(l.url||l.usrl||'').trim();if(/^ttps:\/\//i.test(raw))raw='h'+raw;try{const u=new URL(raw);if(!['http:','https:'].includes(u.protocol))return null;return {id:uid(),title:String(l.title||'未命名'),url:u.href,description:String(l.description||''),logo:typeof l.logo==='string'&&/^https?:\/\//i.test(l.logo)?l.logo:(typeof l.logo==='string'&&l.logo.trim()?'/assets/images/logos/'+encodeURIComponent(l.logo.split('/').pop()):''),tags:[],private:false,favorite:false}}catch{return null}}
async function getLegacyData(){const res=await fetch('/',{cache:'no-store'});const html=await res.text();const doc=new DOMParser().parseFromString(html,'text/html');const node=doc.querySelector('#webstack-initial-data');if(!node)throw Error('首页未提供旧导航数据');const raw=JSON.parse(node.textContent);return convertLegacy(raw)}
async function showApp(){try{const d=await api('GET','/api/bookmarks');data=Array.isArray(d.categories)?{categories:d.categories}:{categories:[]};if(d.initialized===false){try{data=await getLegacyData();$('#emptyHint').classList.remove('hidden');$('#emptyHint').textContent='已从当前首页读取旧书签。首次保存后会迁移到云端；原来的分组层级会以“主分类 / 子分类”方式保留。请检查后点击“保存到云端”。'}catch{}}else{$('#emptyHint').classList.add('hidden')}selected=data.categories[0]?.id||null;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');render();status('已登录。'+(data.categories.length?' 已载入 '+data.categories.length+' 个分类。':''))}catch(e){$('#loginStatus').textContent=e.message}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginStatus').textContent='正在登录…';try{await api('POST','/api/auth',{password:$('#password').value});$('#password').value='';await showApp()}catch(err){$('#loginStatus').textContent=err.message}};
start();
</script></body></html>
